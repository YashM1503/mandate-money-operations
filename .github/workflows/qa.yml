name: MVP QA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: pip-audit -r requirements.lock
      - run: docker build -t mandate-ci .
      - run: chmod +x scripts/smoke_image.sh && scripts/smoke_image.sh mandate-ci
